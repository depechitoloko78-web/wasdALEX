let prefs;try{prefs=JSON.parse(localStorage.getItem('ucb-preferences')||'{}')}catch{prefs={}}
const state={route:'inicio',month:5,year:2025,selected:18,filter:'Todos',period:'I-2025',campus:'Todas las sedes',degree:'Diseño Digital',shift:'Todos los turnos',enrolled:new Set(),completed:new Set([0]),program:prefs.program||'Licenciatura en Diseño Digital',notifications:prefs.notifications!==false,notificationOpen:false,requests:[],signedOut:false};
const app=document.querySelector('#app'),dialog=document.querySelector('#dialog');
const btn=(text,action,style='primary',extra='')=>`<button class="btn ${style}" data-action="${action}" ${extra}>${text}</button>`;
const goto=(label,route,klass='textbtn')=>`<button class="${klass}" data-route="${route}">${label}${icon('arrow')}</button>`;
const box=(name,color='')=>`<span class="iconbox ${color}">${icon(name)}</span>`;
const heading=(eyebrow,title,subtitle,badge='')=>`<div class="intro"><div class="eyebrow">${eyebrow}</div><div class="introline"><div><h1>${title}<span class="dot">.</span></h1><p>${subtitle}</p></div>${badge?`<span class="badge">${badge}</span>`:''}</div></div>`;
const section=(eyebrow,title,action='')=>`<div class="sectionhead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div>${action}</div>`;
const eventHTML=e=>`<div class="agenda"><div class="datebox"><strong>${e.day}</strong><small>JUN</small></div><div><div class="meta"><span class="tag ${e.type==='Examen'?'exam':e.type==='Clase'?'class':''}">${e.type}</span>${e.time}</div><strong>${e.name}</strong><p>${e.course}</p></div></div>`;
function home(){return heading('MIÉRCOLES, 18 DE JUNIO DE 2025','Hola, Camila','Tu día en la UCB comienza aquí. Vamos paso a paso.','Periodo I-2025')+`<section class="hero"><div class="hero-content"><div class="eyebrow">✧ LO QUE SIGUE PARA TI</div><h2>Cada paso te acerca a lo que sueñas.</h2><p>Tu próxima entrega es el 18 de junio. Tienes todo para lograrlo.</p>${goto('Ver mi calendario','calendario','btn gold')}</div><div class="hero-art" aria-hidden="true"><span class="star">✦</span></div></section>`+section('HECHO PARA TI','¿Qué quieres hacer hoy?',goto('Explorar servicios','tramites'))+`<div class="quickgrid">${quicks.map(q=>`<button class="quick" data-route="${q[3]}">${box(q[2],q[4])}<span><strong>${q[0]}</strong><small>${q[1]}</small></span></button>`).join('')}</div><div class="grid two"><section>${section('TU AGENDA','Próximos vencimientos',goto('Ver calendario','calendario'))}<div class="panel">${events.slice(0,3).map(eventHTML).join('')}</div></section><section>${section('TU RECORRIDO','Primeros pasos')}<div class="panel onboard"><strong>¡Bienvenida a la UCB!</strong><p>${state.completed.size} de 3 pasos completados</p><div class="progress"><span style="width:${state.completed.size/3*100}%"></span></div>${['Explora tu portal universitario','Revisa tus cursos y horarios','Conoce la biblioteca virtual'].map((s,i)=>`<button class="step" data-action="step:${i}"><span class="check">${state.completed.has(i)?icon('check'):i+1}</span>${s}${icon('chevron')}</button>`).join('')}</div></section></div>`}
function coursePage(){const visible=state.period==='I-2025'?courses:[];return heading('AULA VIRTUAL','Aprende a tu ritmo','Todo lo que necesitas para seguir avanzando en tus materias.')+`<div class="panel coursebar">${box('book','purple')}<div><strong>Mis asignaturas</strong><small>${visible.length} cursos activos</small></div><div class="period"><label for="period">Periodo</label><select id="period" data-field="period">${['I-2025','II-2025','II-2024'].map(p=>`<option ${p===state.period?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="grid two courses">${visible.map((c,i)=>`<article class="course">${box('book',c.color)}<div class="coursebody"><div class="coursetop"><span class="code">${c.code}</span><span class="campus">⌾ La Paz</span></div><h3>${c.name}</h3><p>${c.teacher}</p><div class="courseprogress"><div class="meta"><span>Progreso del curso</span><strong>${c.progress}%</strong></div><div class="progress" role="progressbar" aria-label="Progreso de ${c.name}" aria-valuenow="${c.progress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${c.progress}%;${c.color==='gold'?'background:var(--gold)':''}"></span></div></div><div class="courseactions">${btn(`Ir al aula ${icon('external')}`,`class:${i}`)}${goto('Notas parciales','kardex')}</div></div></article>`).join('')}</div>${visible.length?'':`<div class="panel empty">No tienes cursos activos en este periodo.${state.period==='II-2025'?'<p>Consulta las asignaturas disponibles para tu próximo periodo.</p>'+goto('Ver inscripción','inscripcion'):goto('Ver historial académico','kardex')}</div>`}`}
function calendarPage(){const first=new Date(state.year,state.month,1),offset=(first.getDay()+6)%7,days=new Date(state.year,state.month+1,0).getDate(),prev=new Date(state.year,state.month,0).getDate();const hasEvents=state.month===5&&state.year===2025;const filtered=hasEvents?events.filter(e=>state.filter==='Todos'||e.type===({'Entregas':'Entrega','Exámenes':'Examen','Clases':'Clase'}[state.filter])):[];return heading('TU TIEMPO, ORGANIZADO','Tu calendario','Clases, exámenes y entregas en un solo lugar.')+`<div class="calendar-layout"><section class="panel"><div class="monthhead"><div><div class="eyebrow">PERIODO I-2025</div><h2>${first.toLocaleDateString('es',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase()).replace(' de ',' ')}</h2></div><div class="arrows"><button aria-label="Mes anterior" data-action="month:-1">${icon('left')}</button><button aria-label="Mes siguiente" data-action="month:1">${icon('chevron')}</button></div></div><div class="calendar-grid">${['L','M','M','J','V','S','D'].map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:offset},(_,i)=>`<span class="day muted">${prev-offset+i+1}</span>`).join('')}${Array.from({length:days},(_,i)=>`<button class="day ${state.selected===i+1?'selected':''} ${hasEvents&&events.some(e=>e.day===i+1)?'event':''}" aria-label="${i+1} de ${first.toLocaleDateString('es',{month:'long'})}" aria-pressed="${state.selected===i+1}" data-action="day:${i+1}">${i+1}</button>`).join('')}</div><div class="legend"><span>Entrega</span><span>Examen</span><span>Clase</span></div><div id="day-detail" class="footnote">${hasEvents&&events.some(e=>e.day===state.selected)?events.filter(e=>e.day===state.selected).map(e=>e.name).join(' · '):'Sin actividades para el día seleccionado.'}</div></section><section><div class="eyebrow">PRÓXIMAMENTE</div><h2>Tu agenda</h2><div class="pills">${['Todos','Entregas','Exámenes','Clases'].map(f=>`<button class="pill ${f===state.filter?'active':''}" data-action="filter:${f}" aria-pressed="${f===state.filter}">${f}</button>`).join('')}</div><div class="panel">${filtered.length?filtered.map(eventHTML).join(''):'<div class="empty">No hay actividades de este tipo en este mes.</div>'}</div></section></div>`}
function enrollmentPage(){const found=state.campus!=='Todas las sedes'&&state.campus!=='La Paz'||state.degree!=='Diseño Digital'||state.shift==='Tarde'?[]:subjects;return heading('PERIODO II-2025','Tu próximo capítulo','Encuentra e inscríbete a las asignaturas que siguen en tu camino.')+`<div class="notice">${icon('info')}<div><strong>Inscripciones abiertas</strong><p>El periodo de inscripción estará disponible hasta el 30 de junio de 2025.</p></div></div>`+section('ENCUENTRA TU MATERIA','Asignaturas disponibles')+`<div class="panel filters">${[['campus','Sede',['Todas las sedes','La Paz','Cochabamba','Santa Cruz']],['degree','Carrera',['Diseño Digital','Comunicación Social','Administración']],['shift','Turno',['Todos los turnos','Mañana','Tarde']]].map(([field,label,options])=>`<div><label for="${field}">${label}</label><select id="${field}" data-field="${field}">${options.map(v=>`<option ${state[field]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><p class="count">${found.length} asignaturas encontradas</p>${found.length?found.map(s=>`<article class="enrollment"><div><span class="code">${s.code} · LA PAZ</span><h3>${s.name}</h3><p>${s.teacher}</p><div class="detail"><span>${icon('clock')}${s.time}</span><span>${icon('pin')}Aula ${s.room}</span></div></div><div class="enrollright"><span class="availability">${s.seats} cupos disponibles</span>${btn(s.locked?'No disponible':state.enrolled.has(s.code)?`Inscrita ${icon('check')}`:`Inscribirme ${icon('arrow')}`,`enroll:${s.code}`,state.enrolled.has(s.code)?'success':'primary',s.locked||state.enrolled.has(s.code)?'disabled':'')}${s.locked?'<small>Requiere prerrequisitos</small>':''}</div></article>`).join(''):'<div class="panel empty">No hay asignaturas disponibles para estos filtros.<p>Prueba con otra sede, carrera o turno.</p></div>'}`}
const grades=[['Fundamentos de Diseño Digital','DIS-203',88,90,89],['Comunicación Visual','COM-211',82,86,84],['Metodología de Investigación','INV-201',75,80,78]];
function kardex(){return heading('HISTORIAL ACADÉMICO','Tu camino, en números','Cada materia es un logro. Mira lo lejos que has llegado.')+`<div class="grid three stats"><div class="panel stat"><div class="eyebrow">PROMEDIO GENERAL</div><div class="statnumber">86<small>/100</small></div><p>Un gran trabajo, sigue así.</p></div><div class="panel stat"><div class="eyebrow">CRÉDITOS APROBADOS</div><div class="statnumber">128<small>/160</small></div><p>80% de tu carrera completada</p><div class="progress"><span style="width:80%"></span></div></div><div class="panel stat"><div class="eyebrow">ASIGNATURAS APROBADAS</div><div class="statnumber">32</div><p>Y muchas más por venir.</p></div></div>`+section('TU TRAYECTORIA','Historial por periodo',btn(`${icon('download')} Descargar Kárdex PDF`,'pdf','outline'))+`<div class="panel tablewrap"><table><caption>Periodo II-2024 <span style="float:right;color:var(--muted);font-size:12px;font-weight:400">3 asignaturas</span></caption><thead><tr><th>ASIGNATURA</th><th>PARCIALES (40%)</th><th>FINAL (60%)</th><th>NOTA FINAL</th></tr></thead><tbody>${grades.map(g=>`<tr><td>${g[0]}<small>${g[1]}</small></td><td>${g[2]}</td><td>${g[3]}</td><td><span class="score">${g[4]}</span></td></tr>`).join('')}</tbody></table></div><p class="footnote">Las calificaciones mostradas corresponden a periodos concluidos. La nota mínima de aprobación es 51.</p>`}
const services=[['Inscripción de asignaturas','Planifica tu siguiente periodo y asegura tu lugar.','clipboard','purple','inscripcion'],['Pagos y estado de cuenta','Consulta tus pagos y próximos vencimientos.','credit','gold','pagos'],['Certificados académicos','Solicita constancias y certificados en línea.','files','green','certificado'],['Historial de solicitudes','Sigue el estado de tus trámites recientes.','clock','peach','historial']];
function recent(){return `<div class="panel">${[...state.requests.map((r,i)=>[r,`Solicitud #UC-2025-${843+i} · Registrada en esta sesión`,'En revisión']),['Certificado de alumno regular','Solicitud #UC-2025-0842 · 12 de junio de 2025','En revisión'],['Pago de matrícula · I-2025','Referencia #PG-2025-1842 · 3 de febrero de 2025','Aprobado']].map(r=>`<div class="request"><div><strong>${r[0]}</strong><p>${r[1]}</p></div><span class="status ${r[2]==='Aprobado'?'approved':''}">${r[2]}</span></div>`).join('')}</div>`}
function procedures(){return heading('GESTIÓN Y TRÁMITES','Resuelve, sigue adelante','Lo administrativo también puede ser simple. Gestiona todo desde aquí.')+`<div class="grid two">${services.map((s,i)=>`<button class="service" ${i<2?`data-route="${s[4]}"`:`data-action="${s[4]}"`}><div class="servicehead">${box(s[2],s[3])}<small>0${i+1}</small></div><h3>${s[0]}</h3><p>${s[1]}</p><span class="textbtn">Explorar ${icon('arrow')}</span></button>`).join('')}</div><section class="requests">${section('TUS GESTIONES','Solicitudes recientes')}${recent()}</section>`}
function resources(){return heading('RECURSOS Y APOYO','Siempre hay más por descubrir','Herramientas, conocimiento y orientación para acompañarte.')+`<section class="hero library"><div class="hero-content"><div class="eyebrow">BIBLIOTECA VIRTUAL</div><h2>El conocimiento no tiene fronteras.</h2><p>Explora libros, publicaciones y recursos académicos para ir más allá en cada materia.</p>${goto('Explorar catálogo','biblioteca','btn gold')}</div><div class="hero-art" aria-hidden="true">${icon('library')}</div></section><div class="grid three resources">${[['Guías para estudiantes','Respuestas claras para cada etapa de tu recorrido.','info','guias'],['Oferta académica','Conoce programas y oportunidades para crecer.','cap','oferta'],['Apoyo estudiantil','Estamos aquí para escucharte y acompañarte.','user','apoyo']].map(s=>`<button class="service" data-action="${s[3]}"><div class="servicehead">${box(s[2])}</div><h3>${s[0]}</h3><p>${s[1]}</p><span class="textbtn">Descubrir ${icon('arrow')}</span></button>`).join('')}</div>`}
function profile(){return heading('TU CUENTA','Mi perfil','Tu información y preferencias en un solo lugar.')+`<div class="profilegrid"><div class="panel profilecard"><div class="profilecover"></div><div class="avatar profileavatar">CM</div><h2>Camila Mercado</h2><p>Estudiante · ${state.program.startsWith('Licenciatura')?'Diseño Digital':'Innovación Digital'}</p><span class="studentid">ID UCB: EST-2021-04827</span></div><div class="profiledetails"><section class="panel"><h3>Programa activo</h3><div class="program">${box('cap','purple')}<div><strong>${state.program}</strong><p>Sede La Paz · Plan 2021</p></div></div><label for="program">Cambiar programa activo</label><select id="program" data-field="program">${['Licenciatura en Diseño Digital','Diplomado en Innovación Digital'].map(p=>`<option ${state.program===p?'selected':''}>${p}</option>`).join('')}</select></section><section class="panel"><h3>Preferencias</h3><div class="preference"><div><strong>Notificaciones</strong><p>Recibe avisos académicos importantes</p></div><button role="switch" aria-checked="${state.notifications}" aria-label="Notificaciones académicas" class="switch" data-action="toggle"></button></div>${btn(`${icon('logout')} Cerrar sesión`,'logout','logout')}</section></div></div>`}
function payments(){return heading('ESTADO DE CUENTA','Tus pagos, al día','Consulta el estado de tus obligaciones académicas.')+`<div class="notice">${icon('info')}<div><strong>Vista de demostración</strong><p>Los movimientos son datos de ejemplo. Este frontend no procesa pagos reales.</p></div></div><div class="panel"><div class="request"><div><strong>Pago de matrícula · I-2025</strong><p>Referencia #PG-2025-1842 · 3 de febrero de 2025</p></div><span class="status approved">Aprobado</span></div><div class="empty">No tienes pagos pendientes en este periodo.</div></div>`}
function library(){return heading('BIBLIOTECA VIRTUAL','Encuentra tu próxima idea','Explora recursos para acompañar tu aprendizaje.')+`<div class="panel"><label for="catalog">Buscar en el catálogo</label><input id="catalog" placeholder="Título, autor o tema" style="width:100%"><div class="librarylist" id="catalog-results"></div></div>`}
const books=[['Diseño de interfaces','Principios de usabilidad y diseño digital'],['Investigación de usuarios','Métodos de entrevistas y observación'],['Arquitectura de información','Organización, etiquetas y navegación']];
function catalog(q=''){const found=books.filter(b=>normalize(b.join(' ')).includes(normalize(q)));document.querySelector('#catalog-results').innerHTML=found.length?found.map((b,i)=>`<div class="request"><div><strong>${b[0]}</strong><p>${b[1]}</p></div>${btn('Consultar',`book:${esc(b[0])}`,'outline')}</div>`).join(''):'<div class="empty">No se encontraron recursos. Intenta otro término.</div>'}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function render(){if(state.signedOut){app.innerHTML=`<main style="margin:0;max-width:600px;padding:80px 24px;margin-inline:auto">${heading('PORTAL UCB','Hasta pronto, Camila','Has cerrado la sesión de demostración.')}${btn('Volver al portal','login')}</main>`;return}let title=routes.find(r=>r[0]===state.route)?.[1]||({pagos:'Pagos y estado de cuenta',biblioteca:'Biblioteca virtual'}[state.route]);app.innerHTML=`<aside class="sidebar" aria-label="Navegación principal"><button class="logo" data-route="inicio" aria-label="Inicio UCB">U</button><nav>${routes.map(([id,label,i])=>`<button class="navitem ${id===state.route?'active':''}" data-route="${id}" aria-label="${label}" ${id===state.route?'aria-current="page"':''}>${icon(i)}<span class="navlabel">${label}</span></button>`).join('')}</nav><button class="avatar" data-route="perfil" aria-label="Mi perfil">CM</button></aside><header class="topbar"><div class="breadcrumb"><span>Portal UCB</span>${icon('chevron')}<strong>${state.route==='inicio'?'Mi espacio':title}</strong></div><div class="topactions"><button class="searchtrigger" data-action="search" aria-label="Buscar cursos, trámites, recursos">${icon('search')}<span>Buscar cursos, trámites, recursos...</span><kbd>⌘ K</kbd></button><button class="bell" data-action="notifications" aria-label="Notificaciones" aria-expanded="${state.notificationOpen}">${icon('bell')}</button><button data-route="perfil" aria-label="Mi perfil"><span class="avatar">CM</span></button></div></header><main id="main">${({inicio:home,cursos:coursePage,calendario:calendarPage,inscripcion:enrollmentPage,kardex,tramites:procedures,recursos:resources,perfil:profile,pagos:payments,biblioteca:library}[state.route]||home)()}</main>${state.notificationOpen?notifications():''}`;document.title=`Portal UCB · ${title||'Mi espacio'}`;if(state.route==='biblioteca')catalog()}
function notifications(){return `<section class="notificationpanel" aria-label="Notificaciones"><div class="sectionhead"><div><div class="eyebrow">MANTENTE AL DÍA</div><h3>Notificaciones</h3></div><button data-action="notifications" aria-label="Cerrar notificaciones">${icon('close')}</button></div>${[['Inscripciones abiertas','Ya puedes inscribirte al periodo II-2025.','Hace 2 horas','inscripcion'],['Nueva nota publicada','Investigación de Usuarios · Parcial I','Ayer','kardex'],['Recordatorio de entrega','Prototipo de alta fidelidad vence el 18 de junio.','Hace 2 días','calendario']].map(n=>`<button class="item" data-route="${n[3]}"><strong>${n[0]}</strong><p>${n[1]}</p><small>${n[2]}</small></button>`).join('')}</section>`}
function navigate(route){state.route=route;state.notificationOpen=false;dialog.close();if(location.hash!==`#${route}`)location.hash=route;render();window.scrollTo({top:0});}
let toastTimer;function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4200)}
let restoreFocus;function modal(title,body,footer=''){restoreFocus=document.activeElement;dialog.innerHTML=`<div class="dialoghead"><h2 id="dialog-title">${title}</h2><button data-action="close" aria-label="Cerrar diálogo">${icon('close')}</button></div><div class="dialogbody">${body}</div>${footer?`<div class="dialogfoot">${footer}</div>`:''}`;dialog.setAttribute('aria-labelledby','dialog-title');dialog.showModal()}
function search(){restoreFocus=document.activeElement;dialog.innerHTML=`<div class="dialoghead">${icon('search')}<input id="search" aria-label="Buscar en el portal" placeholder="¿Qué estás buscando?" autocomplete="off"><button data-action="close" aria-label="Cerrar búsqueda">${icon('close')}</button></div><div class="dialogbody"><div class="eyebrow">EXPLORA EL PORTAL</div><div class="searchlist" id="search-results"></div></div><div class="dialogfoot">Busca entre trámites, aulas virtuales, bibliografía y servicios.</div>`;dialog.setAttribute('aria-label','Búsqueda en el portal');dialog.removeAttribute('aria-labelledby');dialog.showModal();searchResults();document.querySelector('#search').focus()}
function searchResults(q=''){const results=quicks.filter(r=>normalize(r[0]+' '+r[1]).includes(normalize(q)));document.querySelector('#search-results').innerHTML=results.length?results.map(r=>`<button class="searchresult" data-route="${r[3]}">${box(r[2])}<span><strong>${r[0]}</strong><small>Acceso rápido</small></span>${icon('chevron')}</button>`).join(''):'<div class="empty">No encontramos resultados para tu búsqueda.</div>'}
function savePrefs(){try{localStorage.setItem('ucb-preferences',JSON.stringify({program:state.program,notifications:state.notifications}))}catch{toast('Tu navegador no permite guardar las preferencias.')}}
function pdf(){const lines=['PORTAL UCB - KARDEX ACADEMICO','Camila Mercado - EST-2021-04827','Periodo II-2024','',...grades.map(g=>`${g[1]}  ${g[0].normalize('NFD').replace(/[\u0300-\u036f]/g,'')}  ${g[2]} / ${g[3]} / ${g[4]}`),'','Promedio general: 86/100 - Creditos: 128/160','Documento de demostracion. Sin validez oficial.'];const stream='BT /F1 12 Tf 45 790 Td '+lines.map((s,i)=>`${i?'0 -24 Td ':''}(${s.replace(/[()\\]/g,'\\$&')}) Tj`).join('\n')+' ET';const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];let out='%PDF-1.4\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=out.length;out+=`xref\n0 6\n0000000000 65535 f \n${offsets.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;const url=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download='Kardex-Camila-Mercado.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Tu Kárdex de demostración se descargó en PDF.')}
function action(value){const [a,param]=value.split(':');switch(a){case'search':search();break;case'close':dialog.close();break;case'notifications':state.notificationOpen=!state.notificationOpen;render();break;case'month':{const d=new Date(state.year,state.month+Number(param),1);state.month=d.getMonth();state.year=d.getFullYear();state.selected=1;render();break}case'day':state.selected=Number(param);render();break;case'filter':state.filter=param;render();break;case'enroll':{const s=subjects.find(s=>s.code===param);if(!s||s.locked||state.enrolled.has(param))return;state.enrolled.add(param);render();toast(`Inscripción registrada para ${s.name}.`);break}case'step':state.completed.add(Number(param));navigate(['inicio','cursos','biblioteca'][param]);break;case'pdf':pdf();break;case'class':{const c=courses[param];modal(c.name,`<p>${c.code} · ${c.teacher}</p><div class="notice"><div><strong>Aula virtual de demostración</strong><p>El acceso al aula real requiere la plataforma y la autenticación de la universidad.</p></div></div><h3>Tu próxima actividad</h3><p>${events[param].name}</p>${btn('Ver calendario','openCalendar')}`);break}case'openCalendar':navigate('calendario');break;case'toggle':state.notifications=!state.notifications;savePrefs();render();toast(state.notifications?'Notificaciones activadas.':'Notificaciones desactivadas.');break;case'logout':modal('Cerrar sesión',`<p>¿Quieres salir de tu sesión de demostración?</p>${btn('Cerrar sesión','confirmLogout','logout')} ${btn('Volver','close','outline')}`);break;case'confirmLogout':dialog.close();state.signedOut=true;render();break;case'login':state.signedOut=false;navigate('inicio');break;case'certificado':modal('Certificados académicos',`<p>Selecciona el documento que necesitas.</p><label for="certificate">Tipo de certificado</label><select id="certificate"><option>Certificado de alumno regular</option><option>Certificado de calificaciones</option><option>Constancia de inscripción</option></select>${btn('Registrar solicitud','requestCertificate')}`,'Las solicitudes se simulan en esta sesión.');break;case'requestCertificate':{const name=document.querySelector('#certificate').value;state.requests.unshift(name);dialog.close();render();toast('Solicitud de demostración registrada.');break}case'historial':modal('Historial de solicitudes',recent());break;case'guias':modal('Guías para estudiantes',`<h3>Primeros pasos en tu portal</h3><p>Consulta tus cursos, organiza tus actividades en el calendario y revisa tus calificaciones en el Kárdex.</p><h3>Inscripción de asignaturas</h3><p>Filtra por sede, carrera y turno. Las materias con prerrequisitos pendientes no están disponibles.</p>`);break;case'oferta':modal('Oferta académica',`<h3>Licenciatura en Diseño Digital</h3><p>Sede La Paz · Plan 2021</p><h3>Diplomado en Innovación Digital</h3><p>Consulta tu programa activo en el perfil.</p>${btn('Ver mi perfil','openProfile')}`);break;case'openProfile':navigate('perfil');break;case'apoyo':modal('Apoyo estudiantil','<h3>Orientación académica</h3><p>Acude a la coordinación de tu carrera para recibir orientación sobre materias y tu plan de estudios.</p><h3>Bienestar estudiantil</h3><p>Consulta los canales oficiales de la UCB para conocer horarios de atención.</p>');break;case'book':modal(esc(param),'<p>Recurso de ejemplo del catálogo académico.</p><p>La consulta de publicaciones reales requiere conexión con la biblioteca de la universidad.</p>');break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-route],[data-action]');if(!el||el.disabled)return;if(el.dataset.route)navigate(el.dataset.route);else action(el.dataset.action)});
document.addEventListener('change',e=>{const field=e.target.dataset.field;if(!field)return;state[field]=e.target.value;if(field==='program'){savePrefs();toast('Programa activo actualizado.')}render()});
document.addEventListener('input',e=>{if(e.target.id==='search')searchResults(e.target.value);if(e.target.id==='catalog')catalog(e.target.value)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dialog.open)search()}if(e.key==='Escape'&&state.notificationOpen){state.notificationOpen=false;render()}});
dialog.addEventListener('close',()=>{if(restoreFocus?.isConnected)restoreFocus.focus()});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if([...routes.map(r=>r[0]),'pagos','biblioteca'].includes(route)&&route!==state.route)navigate(route)});
if([...routes.map(r=>r[0]),'pagos','biblioteca'].includes(location.hash.slice(1)))state.route=location.hash.slice(1);render();

</script>
</body>
</html>
